# Collects fixtures, renders the site and deploys it to Cloudflare (free plan).
# Collector state (archive, caches, URL registry, sitemap timestamps) persists
# between runs in one Workers KV key, so URLs and lastmod survive every run.
# Setup: docs/cloudflare.md.
name: Collect and deploy to Cloudflare
on:
  # GitHub delays and drops scheduled runs under load: the former 3-hourly
  # schedule fired about three times a day, so new fixtures, kickoff changes
  # and channel listings reached the site and sitemaps up to 13 hours late.
  # Two slots an hour keep publication close to the sources; the concurrency
  # group below runs them one at a time. Public repository: no minute quota.
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATE_NAMESPACE_ID: ${{ vars.STATE_NAMESPACE_ID }}
      DATA_DIR: runtime
      SITE_ORIGIN: https://whoplaysnow.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore collector state
        run: |
          mkdir -p runtime
          if npx wrangler kv key get runtime-state --namespace-id "$STATE_NAMESPACE_ID" --remote > state.b64 && [ -s state.b64 ]; then
            base64 -d state.b64 | tar -xz -C runtime
          else
            echo "::warning::No saved collector state; starting fresh"
          fi
      - run: npm run collect
      - name: Save collector state
        run: |
          tar -cz -C runtime . | base64 -w0 > state.b64
          npx wrangler kv key put runtime-state --path state.b64 --namespace-id "$STATE_NAMESPACE_ID" --remote
      - run: npm test
      - run: npm run build:static
      # Audits the build about to ship, served by the same Express app the static
      # pages were rendered from. Cloudflare blocks GitHub runner IPs, so the
      # live site cannot be crawled from here. Reported, never blocks a deploy.
      - name: Crawl audit
        continue-on-error: true
        run: |
          PORT=3100 npx tsx server.ts > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3100/healthz > /dev/null && break; sleep 2; done
          npx tsx scripts/seo-audit.ts --origin "$SITE_ORIGIN" --via http://127.0.0.1:3100 --sample 10
      - run: npx wrangler deploy
