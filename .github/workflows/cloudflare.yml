# Collects fixtures, renders the site and deploys it to Cloudflare (free plan).
# Collector state (archive, caches, URL registry, sitemap timestamps) persists
# between runs in one Workers KV key, so URLs and lastmod survive every run.
# Setup: docs/cloudflare.md.
name: Collect and deploy to Cloudflare
on:
  # GitHub delays and drops scheduled runs under load: the former 3-hourly
  # schedule fired about three times a day, so new fixtures, kickoff changes
  # and channel listings reached the site and sitemaps up to 13 hours late.
  # Two slots an hour keep publication close to the sources; the concurrency
  # group below runs them one at a time. Public repository: no minute quota.
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATE_NAMESPACE_ID: ${{ vars.STATE_NAMESPACE_ID }}
      DATA_DIR: runtime
      SITE_ORIGIN: https://whoplaysnow.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Workers KV caps one value at 25 MiB and the state outgrew it (26.3 MB on
      # 13 Nov 2026), so it is stored as numbered parts plus a part count written
      # last. The single legacy key is still read if no parts exist yet.
      - name: Restore collector state
        run: |
          mkdir -p runtime
          kv() { npx wrangler kv key get "$1" --namespace-id "$STATE_NAMESPACE_ID" --remote; }
          parts=$(kv runtime-state-parts 2>/dev/null || true)
          if [[ "$parts" =~ ^[0-9]+$ ]] && [ "$parts" -gt 0 ]; then
            : > state.tgz
            for i in $(seq 0 $((parts-1))); do kv "runtime-state-$i" > part.b64; base64 -d part.b64 >> state.tgz; done
            tar -xz -C runtime -f state.tgz
            echo "Restored collector state from $parts parts ($(stat -c %s state.tgz) bytes)"
          elif kv runtime-state > state.b64 && [ -s state.b64 ] && base64 -d state.b64 > state.tgz 2>/dev/null; then
            tar -xz -C runtime -f state.tgz
            echo "Restored collector state from the legacy single key"
          else
            echo "::warning::No saved collector state; starting fresh"
          fi
      - run: npm run collect
      - name: Save collector state
        run: |
          du -b runtime/* | sort -n | tail -5
          # *.previous are per-run rollback copies; the next run recreates them.
          tar -cz --exclude='./*.previous' --exclude='./collection.lock' -C runtime . > state.tgz
          rm -f state.part.*
          split -b 15000000 -d -a 2 state.tgz state.part.
          n=0
          for f in state.part.??; do
            base64 -w0 "$f" > "$f.b64"
            npx wrangler kv key put "runtime-state-$n" --path "$f.b64" --namespace-id "$STATE_NAMESPACE_ID" --remote
            n=$((n+1))
          done
          printf '%s' "$n" > parts.txt
          npx wrangler kv key put runtime-state-parts --path parts.txt --namespace-id "$STATE_NAMESPACE_ID" --remote
          echo "Saved collector state as $n parts ($(stat -c %s state.tgz) bytes)"
      - run: npm test
      - run: npm run build:static
      # Audits the build about to ship, served by the same Express app the static
      # pages were rendered from. Cloudflare blocks GitHub runner IPs, so the
      # live site cannot be crawled from here. Reported, never blocks a deploy.
      - name: Crawl audit
        continue-on-error: true
        run: |
          PORT=3100 npx tsx server.ts > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3100/healthz > /dev/null && break; sleep 2; done
          npx tsx scripts/seo-audit.ts --origin "$SITE_ORIGIN" --via http://127.0.0.1:3100 --sample 10
      - run: npx wrangler deploy
